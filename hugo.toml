title = "Leonardo Benicio — Apps"
theme = "github.com/lbenicio/theme"
baseURL = "https://apps.lbenicio.dev/"
version = "2.0.10"
locale = "en-us"
resourceDir = "resources"

[pagination]
pagerSize = 24
path = "page"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
style = "github-dark"
guessSyntax = true

[taxonomies]
tag = "tags"
category = "categories"

[outputFormats.markdown]
mediaType = "text/markdown"
isPlainText = true
permalinkable = true

[outputs]
home = ["HTML", "RSS", "markdown"]
page = ["HTML", "markdown"]
section = ["HTML", "RSS", "JSON", "markdown"]
taxonomy = ["HTML", "RSS", "markdown"]
term = ["HTML", "RSS", "markdown"]
404 = ["HTML", "markdown"]

[sitemap]
changefreq = "daily"
priority = 0.5
filename = "sitemap.xml"

[permalinks]
post = "/post/:year/:month/:day/:slug/"

[params]
author = "Leonardo Benicio"
description = "macOS apps crafted for performance and simplicity"
showReadingTime = true

# Social handlers
githubHandler = "lbenicio"
linkedinHandler = "leonardo-benicio"
twitterHandler = "lbenicio_"

# Production site URL
siteUrl = "https://apps.lbenicio.dev/"
appMode = "SINGLE"
singleContent = "content/single/apps.md"

# Fork me ribbon
enableForkMe = false

# Legal links
privacyUrl = "https://legal.lbenicio.dev/docs/privacy-policy"
termsUrl = "https://legal.lbenicio.dev/docs/terms-of-service"

[services.googleAnalytics]
id = "G-MMET7DHDSP"

[privacy.googleAnalytics]
respectDoNotTrack = true
